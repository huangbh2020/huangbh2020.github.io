<li>查看当前的分支，星号标识为当前分支；</li>
</ol>
<figure class="highlight javascript"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">git branch</span><br></pre></td></tr></table></figure>

<p>2、切换分支</p>
<figure class="highlight javascript"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">#切换到master分支</span><br><span class="line">git checkout master</span><br></pre></td></tr></table></figure>

<p>3、合并分支</p>
<figure class="highlight javascript"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">#切换到master分支之后执行，把dev分支合并到master分支</span><br><span class="line">git dev</span><br></pre></td></tr></table></figure>

<p>4、推送分支</p>
<figure class="highlight javascript"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">git push</span><br></pre></td></tr></table></figure>

<p>5、删除本地分支</p>
<figure class="highlight javascript"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">#删除本地dev分支</span><br><span class="line">git branch -d dev</span><br></pre></td></tr></table></figure>

<p>6、删除远程分支</p>
<figure class="highlight javascript"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">#删除远程dev分支</span><br><span class="line">git push origin --<span class="keyword">delete</span> dev</span><br></pre></td></tr></table></figure>

<p>7、新建分支</p>
<figure class="highlight javascript"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br></pre></td><td class="code"><pre><span class="line">#新建dev-<span class="keyword">new</span>分支</span><br><span class="line">git branch dev-<span class="keyword">new</span></span><br><span class="line">#把分支推送到远程</span><br><span class="line">git push origin dev-<span class="keyword">new</span>  或者 git push origin dev-new1</span><br></pre></td></tr></table></figure>
